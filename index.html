<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Adventure Quest</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#101820;color:#f4f7f5;font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:18px}
#game{width:min(100%,1000px);background:#1b2a30;border:1px solid #46616a;border-radius:18px;padding:16px;box-shadow:0 18px 55px #0008}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(22px,4vw,34px);margin:0}.stats{display:flex;gap:12px;flex-wrap:wrap;font-weight:700}
button{border:0;border-radius:10px;background:#e0a83e;color:#172026;padding:10px 14px;font-weight:800;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.1)}button:focus-visible{outline:3px solid white;outline-offset:3px}
#stage{position:relative;margin-top:14px;background:#0c1719;border:2px solid #587078;border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#message{min-height:28px;text-align:center;color:#f5d68d;padding:8px;font-weight:700}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:42px 42px;gap:5px}
.pad button{padding:4px;font-size:19px;background:#45616b;color:white}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.hint{color:#b7c8c9;font-size:13px;line-height:1.5;max-width:470px}
#game:fullscreen{width:100%;height:100%;max-width:none;border:0;border-radius:0;display:flex;flex-direction:column;justify-content:center}
#game:fullscreen #stage{width:min(96vw,1200px);margin:12px auto}
#game:fullscreen canvas{max-height:70vh}
@media(max-width:600px){body{padding:6px}#game{padding:10px}.controls{justify-content:center}.hint{text-align:center}}
</style>
</head>
<body>
<main id="game">
<header>
<h1>🧭 Infinite Adventure Quest</h1>
<div class="stats"><span>Level: <b id="level">1</b></span><span>Keys: <b id="keys">0</b></span><span>Lives: <b id="lives">3</b></span></div>
<button id="fullscreen">⛶ Full Screen</button>
</header>
<div id="stage"><canvas id="board" width="760" height="440" aria-label="Top-down adventure game"></canvas></div>
<div id="message">Find the golden key, then reach the green exit. Watch out for enemies!</div>
<div class="controls">
<div class="pad" aria-label="Touch movement controls">
<button class="up" data-dir="up" aria-label="Move up">▲</button>
<button class="left" data-dir="left" aria-label="Move left">◀</button>
<button class="down" data-dir="down" aria-label="Move down">▼</button>
<button class="right" data-dir="right" aria-label="Move right">▶</button>
</div>
<div class="hint"><b>Controls:</b> Arrow keys or WASD to move. On phones/tablets, use the direction buttons. Collect the key (🗝️), then reach the exit (🚪). Every level is different!</div>
<div><button id="restart">Restart Game</button></div>
</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const W=19,H=11,CW=40,CH=40;
const ui={level:document.getElementById('level'),keys:document.getElementById('keys'),lives:document.getElementById('lives'),message:document.getElementById('message')};
let level=1,keys=0,lives=3,player={x:1,y:1},key={x:17,y:9},exit={x:17,y:1},walls=[],enemies=[],hasKey=false,over=false,lastMove=0,damageLock=0;
const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
function cell(x,y){return y*W+x}
function blocked(x,y){return x<0||y<0||x>=W||y>=H||walls.has(cell(x,y))}
function generate(){
 walls=new Set();
 // Keep a guaranteed winding route: top row, right edge, then bottom row to the key.
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
   const onRoute=(y===1)||(x===17)||(y===9&&x>=1);
   if(!onRoute&&Math.random()<Math.min(.16+(level-1)*.008,.32))walls.add(cell(x,y));
 }
 player={x:1,y:1};key={x:17,y:9};exit={x:17,y:1};hasKey=false;
 enemies=[];
 const count=Math.min(2+level,12);
 for(let i=0;i<count;i++){
   let x,y,tries=0;
   do{x=2+Math.floor(Math.random()*14);y=2+Math.floor(Math.random()*7);tries++}
   while((blocked(x,y)||(x===player.x&&y===player.y)||(x===key.x&&y===key.y)||(x===exit.x&&y===exit.y)||enemies.some(e=>e.x===x&&e.y===y))&&tries<300);
   if(tries<300)enemies.push({x,y,step:0});
 }
 over=false;damageLock=0;update();
}
function update(){ui.level.textContent=level;ui.keys.textContent=keys;ui.lives.textContent=lives}
function say(t){ui.message.textContent=t}
function hit(){if(Date.now()<damageLock||over)return;damageLock=Date.now()+900;lives--;player={x:1,y:1};hasKey=false;say('An enemy caught you! Find the key again.');update();if(lives<=0){over=true;say('Game over! Press Restart Game to try again.');}}
function move(dx,dy){
 if(over)return;const nx=player.x+dx,ny=player.y+dy;
 if(blocked(nx,ny))return;player={x:nx,y:ny};
 if(!hasKey&&player.x===key.x&&player.y===key.y){hasKey=true;keys++;say('You found the key! Head to the exit.');update();}
 if(hasKey&&player.x===exit.x&&player.y===exit.y){level++;say('Level complete! A new map is ready.');generate();}
 if(enemies.some(e=>e.x===player.x&&e.y===player.y))hit();
 draw();
}
function enemyTurn(){
 if(over)return;
 for(const e of enemies){
  if(Math.random()<.58){
   const options=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);
   for(const [dx,dy] of options){const nx=e.x+dx,ny=e.y+dy;
    if(!blocked(nx,ny)&&!(nx===exit.x&&ny===exit.y)&&!(nx===key.x&&ny===key.y)&&!enemies.some(o=>o!==e&&o.x===nx&&o.y===ny)){e.x=nx;e.y=ny;break;}
   }
  }
  if(e.x===player.x&&e.y===player.y)hit();
 }
 draw();
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  ctx.fillStyle=(x+y)%2?'#29483e':'#315544';ctx.fillRect(x*CW,y*CH,CW,CH);
  ctx.strokeStyle='#456957';ctx.strokeRect(x*CW,y*CH,CW,CH);
  if(walls.has(cell(x,y))){ctx.fillStyle='#66747a';ctx.fillRect(x*CW+2,y*CH+2,CW-4,CH-4);ctx.fillStyle='#829096';ctx.fillRect(x*CW+5,y*CH+5,CW-10,7);}
 }
 ctx.font='29px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('🚪',exit.x*CW+CW/2,exit.y*CH+CH/2);
 if(!hasKey)ctx.fillText('🗝️',key.x*CW+CW/2,key.y*CH+CH/2);
 for(const e of enemies){ctx.fillText('👾',e.x*CW+CW/2,e.y*CH+CH/2);}
 ctx.fillText('🧑',player.x*CW+CW/2,player.y*CH+CH/2);
}
function keyHandler(e){if(dirs[e.key]){e.preventDefault();if(Date.now()-lastMove>105){lastMove=Date.now();move(...dirs[e.key]);}}}
window.addEventListener('keydown',keyHandler);
document.querySelectorAll('[data-dir]').forEach(b=>{
 const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];
 let timer=null;
 const start=e=>{e.preventDefault();move(...d);timer=setInterval(()=>move(...d),145)};
 const stop=()=>{clearInterval(timer);timer=null};
 b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
});
document.getElementById('restart').addEventListener('click',()=>{level=1;keys=0;lives=3;generate();say('New adventure! Find the key and reach the exit.');draw();});
const root=document.getElementById('game'),fs=document.getElementById('fullscreen');
fs.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await root.requestFullscreen();else await document.exitFullscreen();}catch(e){say('Full screen is not available in this browser.');}});
document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'✕ Exit Full Screen':'⛶ Full Screen';});
generate();draw();setInterval(enemyTurn,650);
})();
</script>
</body>
</html>
