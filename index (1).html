<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Adventure Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7fa;font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:18px}
#game{width:min(100%,1000px);background:#182630;border:1px solid #40515d;border-radius:16px;padding:16px;box-shadow:0 18px 55px #0008}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(21px,4vw,32px);margin:0}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#263b47;border:1px solid #49606d;border-radius:9px;padding:7px 11px;font-weight:700}
#stage{position:relative;margin-top:14px;background:#0b151b;border-radius:12px;overflow:hidden;border:1px solid #52636c}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#message{min-height:28px;text-align:center;padding:7px;color:#d9e7ed;font-weight:600}
.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
button{background:#2f6f62;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.15)}button:focus-visible{outline:3px solid #f4d35e;outline-offset:2px}
#fullscreen{background:#42566a}.help{color:#c3d0d6;font-size:14px;line-height:1.5}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px}.pad button{padding:3px;font-size:19px;background:#405b6a}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
@media(min-width:760px){.pad{display:none}}
:fullscreen{background:#101820;padding:18px;overflow:auto}#game:fullscreen{width:100%;height:100%;max-width:none;border:0;border-radius:0;display:flex;flex-direction:column;justify-content:center}#game:fullscreen #stage{width:min(96vw,1100px);margin:12px auto}#game:fullscreen canvas{width:100%}
</style>
</head>
<body>
<main id="game">
<header><h1>🌲 Infinite Adventure Quest</h1><div class="stats"><div class="stat">Level: <span id="level">1</span></div><div class="stat">🪙 <span id="score">0</span></div><div class="stat">❤️ <span id="lives">3</span></div></div></header>
<div id="stage"><canvas id="c" width="800" height="520" aria-label="Top-down adventure game"></canvas></div>
<div id="message">Find the golden key 🔑, then reach the green exit. Watch out for roaming creatures!</div>
<div class="controls">
<div><button id="restart">↻ Restart game</button> <button id="fullscreen">⛶ Full screen</button></div>
<div class="help"><b>Controls:</b> WASD or arrow keys to move. Collect the key, avoid enemies, and reach the exit. Every level is newly generated!</div>
<div class="pad" aria-label="Touch controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=20,H=13,T=40,levelEl=document.getElementById('level'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),msg=document.getElementById('message');
let level=1,score=0,lives=3,map=[],player={x:1,y:1},key={x:18,y:1},exit={x:18,y:11},hasKey=false,enemies=[],walls=[],lastMove=0,gameOver=false,won=false;
const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
function rand(n){return Math.floor(Math.random()*n)}
function cell(x,y){return y>=0&&y<H&&x>=0&&x<W}
function blocked(x,y){return !cell(x,y)||map[y][x]===1}
function generate(){
 map=Array.from({length:H},()=>Array(W).fill(0));
 // Keep a guaranteed safe route along the top and down the right edge.
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   if(x===0||y===0||x===W-1||y===H-1)map[y][x]=1;
   else if(!(y===1||x===18||x===1&&y===2)&&Math.random()<Math.min(.16+(level*.012),.32))map[y][x]=1;
 }
 player={x:1,y:1};key={x:18,y:1};exit={x:18,y:11};hasKey=false;enemies=[];
 const count=Math.min(2+level,12);
 for(let i=0;i<count;i++){
   let x,y,tries=0;do{x=2+rand(16);y=2+rand(9);tries++}while((blocked(x,y)||Math.abs(x-player.x)+Math.abs(y-player.y)<5||x===key.x&&y===key.y)&&tries<200);
   if(tries<200)enemies.push({x,y,step:0});
 }
}
function hud(){levelEl.textContent=level;scoreEl.textContent=score;livesEl.textContent=lives}
function draw(){
 ctx.clearRect(0,0,800,520);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const px=x*T,py=y*T;
  ctx.fillStyle=(x+y)%2?'#426b48':'#3c6343';ctx.fillRect(px,py,T,T);
  if(map[y][x]){ctx.fillStyle='#65727a';ctx.fillRect(px+2,py+2,36,36);ctx.fillStyle='#829097';ctx.fillRect(px+6,py+5,12,8);ctx.fillStyle='#4b5960';ctx.fillRect(px+20,py+20,13,11)}
  else if((x*7+y*11)%9===0){ctx.fillStyle='#557b4d';ctx.beginPath();ctx.arc(px+8,py+29,3,0,Math.PI*2);ctx.fill()}
 }
 // exit
 ctx.fillStyle='#d9e8df';ctx.fillRect(exit.x*T+10,exit.y*T+8,20,28);ctx.fillStyle='#35d07f';ctx.fillRect(exit.x*T+13,exit.y*T+8,17,12);ctx.fillStyle='#293d32';ctx.fillRect(exit.x*T+8,exit.y*T+34,24,4);
 if(!hasKey){ctx.fillStyle='#ffd447';ctx.beginPath();ctx.arc(key.x*T+20,key.y*T+20,9,0,Math.PI*2);ctx.fill();ctx.fillRect(key.x*T+26,key.y*T+18,10,4);ctx.fillRect(key.x*T+32,key.y*T+18,3,8)}
 enemies.forEach(e=>{ctx.fillStyle='#b64f43';ctx.beginPath();ctx.arc(e.x*T+20,e.y*T+21,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.fillRect(e.x*T+13,e.y*T+16,4,5);ctx.fillRect(e.x*T+23,e.y*T+16,4,5);ctx.fillStyle='#222';ctx.fillRect(e.x*T+14,e.y*T+18,2,3);ctx.fillRect(e.x*T+24,e.y*T+18,2,3)});
 // player
 ctx.fillStyle='#26384a';ctx.beginPath();ctx.arc(player.x*T+20,player.y*T+24,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0c39a';ctx.beginPath();ctx.arc(player.x*T+20,player.y*T+13,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#315e9a';ctx.fillRect(player.x*T+11,player.y*T+22,18,14);
 if(gameOver||won){ctx.fillStyle='#071018cc';ctx.fillRect(0,0,800,520);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText(won?'YOU WIN!':'GAME OVER',400,245);ctx.font='20px system-ui';ctx.fillText(won?'You completed the adventure!':'Press Restart to try again.',400,285)}
}
function hit(){if(gameOver)return;lives--;hud();player={x:1,y:1};if(lives<=0){gameOver=true;msg.textContent='Game over! Press Restart to begin again.'}else msg.textContent='An enemy caught you! You lost a life.';draw()}
function move(dx,dy){
 if(gameOver||won)return;let nx=player.x+dx,ny=player.y+dy;if(blocked(nx,ny))return;
 player={x:nx,y:ny};
 if(!hasKey&&nx===key.x&&ny===key.y){hasKey=true;score+=10;msg.textContent='You found the key! Now reach the green exit.';hud()}
 if(enemies.some(e=>e.x===nx&&e.y===ny)){hit();return}
 if(hasKey&&nx===exit.x&&ny===exit.y){score+=25;level++;hud();msg.textContent='Level complete! Loading the next adventure…';generate()}
 draw()
}
function enemyTurn(){
 if(gameOver||won)return;
 enemies.forEach(e=>{if(Math.random()<.62){let opts=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);for(const [dx,dy] of opts){let nx=e.x+dx,ny=e.y+dy;if(!blocked(nx,ny)&&!(nx===key.x&&ny===key.y)&&!(nx===exit.x&&ny===exit.y)){e.x=nx;e.y=ny;break}}}});
 if(enemies.some(e=>e.x===player.x&&e.y===player.y))hit();draw()
}
document.addEventListener('keydown',e=>{let d=dirs[e.key];if(d){e.preventDefault();move(...d)}});
document.querySelectorAll('[data-dir]').forEach(b=>{const mapDir={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};b.addEventListener('pointerdown',e=>{e.preventDefault();move(...mapDir[b.dataset.dir])})});
document.getElementById('restart').addEventListener('click',()=>{level=1;score=0;lives=3;gameOver=false;won=false;generate();hud();msg.textContent='Find the golden key, then reach the green exit!';draw()});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.getElementById('game').requestFullscreen();else await document.exitFullscreen()}catch(e){msg.textContent='Full screen is not available in this browser window.'}});
generate();hud();draw();setInterval(enemyTurn,650);
})();
</script>
</body>
</html>
